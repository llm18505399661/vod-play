<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频播放</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
#video{width:100%;max-width:750px;display:block;margin:0 auto}
</style>
</head>
<body>
<video id="video" controls playsinline webkit-playsinline></video>
<script>
const params = new URLSearchParams(location.search);
const VIDEO_ID = params.get("vid");
if(!VIDEO_ID){
  document.body.innerText="缺少视频ID";
}else{
  const apiUrl = `/api/getplay?videoId=${VIDEO_ID}`;
  fetch(apiUrl).then(r=>r.json()).then(data=>{
    if(data.PlayInfoList?.PlayInfo?.length>0){
      document.getElementById('video').src = data.PlayInfoList.PlayInfo[0].PlayURL;
    }else{
      alert("获取播放地址失败");
    }
  }).catch(e=>{
    alert("视频加载失败，请稍后重试");
  })
}
</script>
</body>
</html>
